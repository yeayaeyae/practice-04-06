<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПР6 — регулярные выражения</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<main class="container">
  <header>
    <h1>Практическая работа №6</h1>
    <p>Регулярные выражения: поиск, проверка и извлечение групп.</p>
  </header>

  <section class="panel">
    <h2>Тестер шаблонов</h2>
    <div id="presets" class="actions">
      <button type="button" data-preset="ip">IP-адрес</button>
      <button type="button" data-preset="domain">Домен .com/.ru</button>
      <button type="button" data-preset="word">\d\d \w+</button>
      <button type="button" data-preset="date">Дата с именованными группами</button>
    </div>
    <form id="tester-form" class="form-grid">
      <label>Шаблон <input id="pattern" size="40" value="[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}" autocomplete="off"></label>
      <label>Флаги <input id="flags" size="4" value="" autocomplete="off"></label>
      <label>Текст <input id="text" size="40" value="Эта строка содержит ip-адрес 123.222.63.1" autocomplete="off"></label>
      <button type="submit">Найти</button>
    </form>
    <p id="tester-message" class="message" role="status"></p>
    <table id="matches">
      <thead><tr><th>Позиция</th><th>captured(0)</th><th>Группы 1…n</th><th>Именованные группы</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>Проверка значения</h2>
    <form id="check-form" class="form-grid">
      <label>Значение <input id="check-value" value="08/12/1985" autocomplete="off"></label>
      <button type="submit">Проверить</button>
    </form>
    <pre id="check-output" class="output" role="status"></pre>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
