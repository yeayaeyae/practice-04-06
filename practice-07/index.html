<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПР7 — текстовые файлы</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<main class="container">
  <header>
    <h1>Практическая работа №7</h1>
    <p>Текстовые потоки и файлы. Выбор файла для открытия и сохранения.</p>
  </header>

  <section class="panel">
    <h2>Редактор</h2>
    <div class="form-grid">
      <button type="button" id="open-button">Открыть файл…</button>
      <label>Имя файла <input id="file-name" value="file.txt" autocomplete="off"></label>
      <button type="button" id="save-button">Сохранить</button>
      <input type="file" id="file-input" accept=".txt,text/plain" hidden>
    </div>
    <p id="status" class="message" role="status"></p>
    <label for="editor">Текст</label>
    <textarea id="editor">Hello world! 12 63.5</textarea>
  </section>

  <section class="panel">
    <h2>Обработка</h2>
    <div class="actions">
      <button type="button" id="stats-button">Статистика текста</button>
      <button type="button" id="read-button">Прочитать как поток (h w v1 d1)</button>
    </div>
    <pre id="output" class="output" role="status"></pre>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
